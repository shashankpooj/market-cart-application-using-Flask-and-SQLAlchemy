{% extends 'base.html' %}
{% block title %}
    Welcome to shashank market cart
{% endblock %}
{% block content %}
    <div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center text-white" style="background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); border-radius: 20px;">
        <div class="col-md-6 p-lg-5 mx-auto my-5">
            <h1 class="display-4 font-weight-bold mb-4" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">🛒 Shashank Product Cart</h1>
            <p class="lead mb-4" style="font-size: 1.2rem;">Explore a variety of products and make smart purchases with a single click.</p>
            <a class="btn btn-outline-light btn-lg px-5 py-2 shadow" href="{{ url_for('market_page') }}" style="transition: 0.3s ease;">
                Get Started
            </a>
        </div>
        <div class="product-device box-shadow d-none d-md-block"></div>
        <div class="product-device product-device-2 box-shadow d-none d-md-block"></div>
    </div>
{% endblock %}
